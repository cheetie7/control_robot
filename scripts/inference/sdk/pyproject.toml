[project]
name = "diffusion-sdk-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.23,<2",
  "opencv-python>=4.8,<4.12",
  "pyyaml==6.0.2",
  "msgpack>=1,<2",
  "websockets>=15,<16",
  "xarm-python-sdk>=1.16,<2",
  "pyrobotiqgripper==3.2.8",
  "pyrealsense2>=2.55,<3",
  "pyorbbecsdk2",
]

[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Upstream pyrobotiqgripper 3.2.8 declares impossible NumPy and pytest floors.
override-dependencies = ["numpy>=1.23,<2", "pytest>=7,<9"]
