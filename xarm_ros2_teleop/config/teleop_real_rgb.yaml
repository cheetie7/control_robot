# Real-robot collection profile with two RGB-only RealSense D435 cameras.
# The two known serial numbers are assigned provisionally; swap them if the
# physical front and wrist views are reversed.

system:
  name: control_robot

teleop:
  source: factr
  enabled: true
  config_file: gello_grav_comp_demo.yaml
  offset_file: "~/.config/control_robot/offset.yaml"
  xarm_to_factr_signs: [1, 1, 1, 1, 1, 1, 1]

xarm:
  enabled: true
  ip: "192.168.1.215"
  control_period: 0.01
  state_read_rate_hz: 60.0
  initial_joint_speed_rad_s: 0.5
  max_joint_speed_rad_s: 1.0
  max_joint_acceleration_rad_s2: 0.8
  max_leader_step_rad: 0.2
  max_leader_reject_sec: 0.5
  initial_joint_positions: [0.0, 0.0, 0.0, 1.57, 0.0, 1.57, 0.0]
  reset_lift_mm: 100.0
  reset_lift_speed_mm_s: 50.0
  reset_lift_skip_above_z_mm: 400.0

robotiq:
  enabled: true
  com_port: "/dev/robotiq_rs485"
  device_id: 9
  debug: false
  command_topic: "/xarm/gripper_pos"
  control_period: 0.05
  speed: 255
  force: 100
  minimal_motion: 2
  activate_on_startup: true
  activation_timeout_sec: 15.0

inference:
  enabled: false
  dry_run: true
  host: "127.0.0.1"
  port: 8000
  prompt: "complete the manipulation task"
  policy_frequency_hz: 25.0
  inference_timeout_sec: 30.0
  observation_timeout_sec: 0.25
  max_camera_skew_sec: 0.08
  max_runtime_sec: 120.0
  max_chunks: 100
  # Emergency limit relative to measured inference state and adjacent targets.
  max_joint_step_rad: 0.5
  joint_lower_rad: [-6.2832, -2.059, -6.2832, -0.19198, -6.2832, -1.69297, -6.2832]
  joint_upper_rad: [6.2832, 2.0944, 6.2832, 3.927, 6.2832, 3.1416, 6.2832]
  image_streams: []

rl:
  enabled: false
  policy_action_topic: "/control/policy_action"
  human_arm_topic: "/control/factr_arm"
  human_gripper_topic: "/control/factr_gripper"
  human_connected_topic: "/factr/connected"
  keyboard_enabled: true
  keyboard_device: "/dev/tty"
  stop_velocity_rad_s: 0.03
  stop_stable_sec: 0.3
  # Require continuously fresh human-device input before starting a new episode.
  human_ready_stable_sec: 0.3
  human_input_timeout_sec: 0.25
  policy_timeout_sec: 0.25
  max_human_joint_step_rad: 0.05
  gripper_delta_scale: -1.0
  success_reward: 1.0
  failure_reward: 0.0

reset:
  enabled: true
  action_name: /teleop/reset
  timeout_sec: 30.0
  state_timeout_sec: 0.5
  stable_time_sec: 0.3
  xarm_position_tolerance_rad: 0.03
  xarm_velocity_tolerance_rad_s: 0.05
  factr_state_publish_rate_hz: 60.0
  factr_max_current_ma: 500
  robotiq_open_threshold_bits: 5

cameras:
  enabled: true
  devices:
    - name: front_camera
      enabled: true
      vendor: realsense
      model: d435
      serial_number: "254622075079"
      topic_prefix: camera/front
      required: true
      startup_delay_sec: 0.5
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
      depth:
        enabled: false
      infrared:
        enabled: false
      point_cloud:
        enabled: false

    - name: wrist_camera
      enabled: true
      vendor: realsense
      model: d435
      serial_number: "254522074404"
      topic_prefix: camera/wrist
      required: true
      startup_delay_sec: 1.5
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
      depth:
        enabled: false
      infrared:
        enabled: false
      point_cloud:
        enabled: false

# This profile intentionally launches no tactile sensors.
tactile:
  enabled: false
  devices: []

warmup:
  enabled: true
  sensor_ready_stable_time_sec: 0.5
  # Two D435 RGB streams should become ready quickly; fail visibly instead of
  # waiting five minutes with ROS topics that carry no frames.
  hardware_timeout_sec: 30.0
  finished_delay_sec: 2.0
  require_all_enabled_devices: true

speech:
  enabled: true
  command: "espeak-ng"
  voice: "en-us"
  speed: 160
  volume: 100
  timeout_sec: 10.0
  phrases:
    warmup_started: "warm up"
    warmup_finished: "warm up finished"
    episode_started: "episode {episode} started"
    episode_finished: "episode {episode} finished"
    episode_discarded: "episode {episode} discarded"
    reset_started: "resetting"
    reset_finished: "reset finished"

recording:
  enabled: true
  root: "~/datasets/control_robot"
  dataset_name: "lerobot_dataset"
  append_timestamp: true
  repo_id: "local/control_robot"
  robot_type: "xarm7_factr"
  fps: 30
  instruction: "teleoperate the robot to complete the task"
  # The operator normally ends a collection from the Dashboard. Keep this
  # ceiling high enough for a multi-episode session instead of stopping at 1.
  num_episodes: 1000
  reset_action_name: "/teleop/reset"

  keyboard:
    enabled: true
    device: "/dev/tty"
    auto_start_first_episode: false

  # The front D435 supplies the 30 FPS dataset clock.
  anchor:
    key: front_camera

  sync:
    # Images and state keep one latest value; only small action vectors retain
    # history so labels never use a command newer than the anchor image.
    action_history_sec: 1.0
    # Robotiq publishes at 20 Hz; latest-only snapshots need at least one
    # complete 50 ms period plus normal scheduling margin.
    max_state_skew_sec: 0.075
    max_action_age_sec: 0.075

  video:
    vcodec: h264
    image_writer_threads: 4
    streaming_encoding: false
    # Complete synchronized rows waiting for the background LeRobot writer.
    writer_queue_size: 16

  streams:
    front_camera:
      enabled: true
      topic: "/camera/front/color"
      type: rgb
    wrist_camera:
      enabled: true
      topic: "/camera/wrist/color"
      type: rgb

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  open_browser: true
  status_rate_hz: 2.0
  rosout_min_level: warn
  rosout_history_size: 200
  service_timeout_sec: 30.0

  rerun:
    enabled: true
    grpc_port: 9876
    web_port: 9090
    server_memory_limit: "16MiB"
    max_fps: 10
    preview_scale: 0.5
